  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }

  .logo { position:fixed; top:20px; left:22px; z-index:20; display:block; width:32px; height:32px; }
  .logo img { width:100%; height:100%; display:block; filter:invert(var(--logo-invert));
    opacity:.82; transition:opacity .14s, transform .14s; }
  .logo:hover img { opacity:1; transform:scale(1.08); }
  .logo:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:6px; }
  .logo .tip { position:absolute; top:50%; left:calc(100% + 10px); transform:translate(-4px,-50%);
    white-space:nowrap; font-size:12.5px; font-weight:500; line-height:1;
    background:var(--tip-bg); color:var(--tip-fg); padding:6px 9px; border-radius:6px;
    opacity:0; pointer-events:none; transition:opacity .14s, transform .14s;
    box-shadow:0 2px 10px rgba(0,0,0,.16); }
  .logo:hover .tip, .logo:focus-visible .tip { opacity:1; transform:translate(0,-50%); }

  .theme { position:fixed; top:22px; right:24px; z-index:20;
    width:32px; height:32px; display:grid; place-items:center;
    background:none; border:0; border-radius:8px; cursor:pointer; color:var(--mut); padding:0; }
  .theme:hover { background:var(--hover); color:var(--fg); }
  .theme:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .theme svg { width:17px; height:17px; }
  :root[data-theme="dark"] .i-sun, .i-moon { display:none; }
  :root[data-theme="dark"] .i-moon { display:block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) .i-sun { display:none; }
    :root:not([data-theme]) .i-moon { display:block; }
  }

  /* left nav: full titles, collapsing to hover-labeled dots */
  nav { position:fixed; top:104px; left:22px; z-index:10;
    width:140px; max-height:calc(100vh - 150px); overflow-y:auto; }
  nav::-webkit-scrollbar { width:0; }
  nav .cap { font-size:11px; font-weight:650; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mut); opacity:.65; padding:0 8px; margin-bottom:10px; }
  nav ul { list-style:none; margin:0; padding:0; }
  nav a { position:relative; display:flex; gap:9px; align-items:baseline;
    padding:7px 8px; border-radius:6px; text-decoration:none; color:var(--mut);
    font-size:13.5px; line-height:1.35; transition:color .12s, background .12s; }
  nav a:hover { background:var(--hover); color:var(--fg); }
  nav a:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  nav a .n { font-size:11px; font-variant-numeric:tabular-nums; opacity:.55; }
  nav a.active { color:var(--fg); font-weight:600; }
  nav a.active .n { color:var(--accent); opacity:1; }
  nav .dot { display:none; }

  @media (max-width:1003px) {
    nav { width:auto; overflow:visible; top:108px; left:26px; }
    nav .cap { display:none; }
    nav a { padding:9px 6px; gap:0; align-items:center; border-radius:999px; }
    nav a:hover { background:none; }
    nav a .n { display:none; }
    nav .dot { display:block; width:7px; height:7px; border-radius:50%;
      background:var(--dot); transition:background .14s, transform .14s; }
    nav a:hover .dot { background:var(--fg); transform:scale(1.25); }
    nav a.active .dot { background:var(--accent); transform:scale(1.3); }
    nav a .t { position:absolute; left:22px; top:50%; transform:translate(-4px,-50%);
      white-space:nowrap; font-size:12.5px; font-weight:500; line-height:1;
      background:var(--tip-bg); color:var(--tip-fg); padding:6px 9px; border-radius:6px;
      opacity:0; pointer-events:none; transition:opacity .14s, transform .14s;
      box-shadow:0 2px 10px rgba(0,0,0,.16); }
    nav a:hover .t, nav a:focus-visible .t { opacity:1; transform:translate(0,-50%); }
  }
  @media (max-width:779px) { nav { display:none; } }

  .wrap { max-width:680px; margin:0 auto; padding:64px 24px 96px; }
  header { padding-bottom:40px; border-bottom:1px solid var(--line); }
  .who { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .who img, .who .init { width:46px; height:46px; border-radius:50%; display:block; object-fit:cover; }
  .who .init { display:grid; place-items:center; background:var(--hover);
    color:var(--fg); font-size:17px; font-weight:650; letter-spacing:.02em; }
  .who .nm { font-size:16px; font-weight:650; line-height:1.3; }
  .who .meta { font-size:13.5px; color:var(--mut); line-height:1.4; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 10px; letter-spacing:-.02em; }
  .status { margin-top:16px; font-size:14px; color:var(--mut); line-height:1.6; }
  .status b { color:var(--fg); font-weight:600; }
  section { padding:56px 0; border-bottom:1px solid var(--line); scroll-margin-top:24px; }
  .tag { font-size:12px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); }
  .live { color:var(--ok); margin-left:8px; }
  h2 { font-size:24px; line-height:1.25; margin:12px 0 6px; letter-spacing:-.015em; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:32px; line-height:1.5; }

  /* LinkedIn line-break fidelity:
     blank line -> paragraph gap (p margin); single newline -> tight break (pre-wrap). */
  .post p, .fc p { white-space:pre-wrap; margin:0 0 1.15em; }
  .post p:last-child, .fc p:last-child { margin-bottom:0; }

  .post .media { margin:26px 0 0; }
  .post .media img { max-width:100%; border-radius:10px; display:block; }
  .post .media .cap { margin-top:8px; font-size:12.5px; color:var(--mut); }
  .post .media.strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;
    -webkit-overflow-scrolling:touch; }
  .post .media.strip img { width:180px; max-width:none; flex:0 0 auto; }
  .post .media-link { margin-top:10px; font-size:13px; }
  .post .media-link a { color:var(--fg); }
  .post .media .pending { font-size:13px; color:var(--mut); font-style:italic; }

  .fc-label { margin-top:36px; font-size:12px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .fc { margin-top:10px; padding-left:16px; border-left:2px solid var(--line); color:var(--mut); }
  .foot { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:36px; font-size:13px; color:var(--mut); }
  .pid { margin-top:10px; font-size:12px; color:var(--mut); }
  code { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  footer { padding-top:40px; font-size:14px; color:var(--mut); line-height:1.6; }
  footer b { color:var(--fg); } footer p { margin:0 0 12px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    nav .dot, nav a .t, .theme, .logo img, .logo .tip { transition:none; }
    .logo:hover img { transform:none; }
  }
</style></head><body>

<script>
(function () {
  var root = document.documentElement, KEY = 'bamf-review-theme';
  // initial theme is applied by the inline <head> script, before first paint

  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });

  var links = [].slice.call(document.querySelectorAll('nav a'));
  var sections = [].slice.call(document.querySelectorAll('section[id]'));
  function setActive(id) {
    links.forEach(function (a) { a.classList.toggle('active', a.dataset.target === id); });
  }
  var io = new IntersectionObserver(function (entries) {
    var visible = entries.filter(function (e) { return e.isIntersecting; });
    if (!visible.length) return;
    visible.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    setActive(visible[0].target.id);
  }, { rootMargin: '-20% 0px -65% 0px', threshold: 0 });
  sections.forEach(function (s) { io.observe(s); });
  if (sections.length) setActive(sections[0].id);
})();
</script>
